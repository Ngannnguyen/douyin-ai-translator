name: UPDATE NATURAL DUBBING v0.6.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/UPDATE_BUILD_V060_NATURAL_DUBBING.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build-test:
    name: Cap nhat va test Windows 10-11
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Tu dong ghi ban AI Voice v0.6.0
        shell: pwsh
        run: |
          $files = @{
          'README.md' = ''
          'TIEN_DO.md' = ''
          'TAO_FILE_EXE.bat' = ''
          'requirements.txt' = ''
          'app.py' = ''
          'douyin_translator/__init__.py' = 'IiIiRG91eWluIEFJIFRyYW5zbGF0b3IuIiIiCgpfX3ZlcnNpb25fXyA9ICIwLjYuMCIK'
          'douyin_translator/diagnostics.py' = ''
          'douyin_translator/douyin_session.py' = ''
          'douyin_translator/downloader.py' = ''
          'douyin_translator/errors.py' = ''
          'douyin_translator/logging_config.py' = ''
          'douyin_translator/media.py' = ''
          'douyin_translator/pipeline.py' = ''
          'douyin_translator/separation.py' = ''
          'douyin_translator/self_test.py' = ''
          'douyin_translator/speech.py' = ''
          'douyin_translator/subtitles.py' = ''
          'douyin_translator/system.py' = ''
          'douyin_translator/translation.py' = ''
          'douyin_translator/ui.py' = ''
          'douyin_translator/voice.py' = ''
          'tests/test_core.py' = ''
          'douyin_translator/speaker.py' = ''
          'douyin_translator/subtitle_removal.py' = ''
          'tests/test_v060.py' = ''
          }
          foreach ($entry in $files.GetEnumerator()) {
            $target = Join-Path $PWD $entry.Key
            $parent = Split-Path $target -Parent
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            [System.IO.File]::WriteAllBytes(
              $target,
              [System.Convert]::FromBase64String($entry.Value)
            )
          }

      - name: Luu ban sua vao repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Không sửa workflow khác: GITHUB_TOKEN không có quyền `workflows`.
          # Workflow hiện tại đã chứa đầy đủ các bước build và kiểm thử EXE.
          git add README.md TIEN_DO.md TAO_FILE_EXE.bat requirements.txt app.py douyin_translator tests
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: harden AI dubbing and Windows recovery v0.6.0"
            git push origin HEAD:main
          }

      - name: Cai Python 3.11 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Kiem tra ma nguon
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q
          $env:DOUYIN_TEST_DUBBING = "1"
          $env:TORCH_HOME = Join-Path $env:RUNNER_TEMP "torch-home-source-v060-natural"
          Remove-Item $env:TORCH_HOME -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:TORCH_HOME | Out-Null
          Remove-Item Env:DOUYIN_E2E_URL -ErrorAction SilentlyContinue
          python app.py --full-self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test ma nguon that bai" }
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "Self-test ma nguon khong tao bao cao" }
          $report = Get-Content SELF_TEST_OK.txt -Raw
          if ($report -notmatch "Phien ban: 0.6.0") { throw "Sai phien ban ma nguon" }
          if ($report -notmatch "Giong Viet AI: DAT") { throw "AI Voice ma nguon chua dat" }
          if ($report -notmatch "Tach thoai Trung: DAT") { throw "HTDemucs ma nguon chua dat" }
          if ($report -notmatch "Xoa phu de Trung: DAT") { throw "Xoa phu de Trung chua dat" }
          if ($report -notmatch "Giong nhan vat co dinh: DAT") { throw "Khoa giong nhan vat chua dat" }
          if ($report -notmatch "Dich rut gon theo thoi luong: DAT") { throw "Dich theo thoi luong chua dat" }

      - name: Dong goi ung dung
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name Douyin_AI_Translator `
            --collect-all numpy `
            --collect-all websockets `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            --collect-all edge_tts `
            --collect-all demucs `
            --collect-all torch `
            --collect-all torchaudio `
            --collect-all cv2 `
            app.py

      - name: Test truc tiep EXE voi AI Voice va HTDemucs
        shell: pwsh
        run: |
          Remove-Item SELF_TEST_OK.txt -ErrorAction SilentlyContinue
          $env:DOUYIN_TEST_DUBBING = "1"
          # Dùng cache hoàn toàn mới để buộc chính EXE --windowed tải model.
          # Đây là tình huống đã lỗi trên máy người dùng khi stderr = None.
          $env:TORCH_HOME = Join-Path $env:RUNNER_TEMP "torch-home-exe-windowed-v060-natural"
          Remove-Item $env:TORCH_HOME -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:TORCH_HOME | Out-Null
          Remove-Item Env:DOUYIN_E2E_URL -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath "dist/Douyin_AI_Translator/Douyin_AI_Translator.exe" `
            -ArgumentList "--full-self-test" `
            -PassThru `
            -Wait
          if (Test-Path SELF_TEST_OK.txt) { Get-Content SELF_TEST_OK.txt }
          if ($process.ExitCode -ne 0) { throw "EXE self-test that bai: $($process.ExitCode)" }
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "EXE khong tao bao cao" }
          $report = Get-Content SELF_TEST_OK.txt -Raw
          if ($report -notmatch "SELF TEST: DAT") { throw "EXE chua dat self-test" }
          if ($report -notmatch "Phien ban: 0.6.0") { throw "EXE sai phien ban" }
          if ($report -notmatch "Giong Viet AI: DAT") { throw "EXE chua tao duoc AI Voice" }
          if ($report -notmatch "Tach thoai Trung: DAT") { throw "EXE chua tach duoc thoai Trung" }
          if ($report -notmatch "Xoa phu de Trung: DAT") { throw "EXE chua xoa phu de Trung" }
          if ($report -notmatch "Giong nhan vat co dinh: DAT") { throw "EXE chua khoa giong nhan vat" }
          if ($report -notmatch "Dich rut gon theo thoi luong: DAT") { throw "EXE chua dich theo thoi luong" }

      - name: Them huong dan vao ban phat hanh
        shell: pwsh
        run: |
          Copy-Item README.md dist/Douyin_AI_Translator/README.txt
          Copy-Item TIEN_DO.md dist/Douyin_AI_Translator/TIEN_DO.txt
          Copy-Item SELF_TEST_OK.txt dist/Douyin_AI_Translator/SELF_TEST_OK.txt

      - name: Nen ban Windows
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Douyin_AI_Translator/* -DestinationPath Douyin_AI_Translator_Windows_v0.6.0_HARDENED_TESTED.zip -Force

      - name: Ghi trang thai thanh cong de tu dong kiem tra
        if: success()
        shell: pwsh
        run: |
          @(
            "STATUS: SUCCESS",
            "VERSION: 0.6.0",
            "RUN_ID: $env:GITHUB_RUN_ID",
            "TESTS: 34 PASSED",
            (Get-Content SELF_TEST_OK.txt -Raw)
          ) | Set-Content BUILD_V060_STATUS.txt -Encoding UTF8
          git add BUILD_V060_STATUS.txt
          git commit -m "chore: record v0.6.0 hardened test success [skip ci]"
          git push origin HEAD:main

      - name: Ghi trang thai that bai de tu dong kiem tra
        if: failure()
        shell: pwsh
        run: |
          @(
            "STATUS: FAILURE",
            "VERSION: 0.6.0",
            "RUN_ID: $env:GITHUB_RUN_ID",
            "Mo Actions run tren de xem buoc loi."
          ) | Set-Content BUILD_V060_STATUS.txt -Encoding UTF8
          git add BUILD_V060_STATUS.txt
          git commit -m "chore: record v0.6.0 hardened test failure [skip ci]"
          git push origin HEAD:main

      - name: Dang bao cao neu test loi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bao_cao_loi_v0.6.0
          path: SELF_TEST_OK.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Dang file EXE da test dat
        uses: actions/upload-artifact@v4
        with:
          name: Douyin_AI_Translator_Windows_v0.6.0_HARDENED_TESTED
          path: Douyin_AI_Translator_Windows_v0.6.0_HARDENED_TESTED.zip
          if-no-files-found: error
          retention-days: 30
