name: TEST WINDOWS v0.6.3

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "douyin_translator/**"
      - "tests/**"
      - ".github/workflows/UPDATE_BUILD_V061_NATURAL_DUBBING_TEST_FIX.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "douyin_translator/**"
      - "tests/**"
      - ".github/workflows/UPDATE_BUILD_V061_NATURAL_DUBBING_TEST_FIX.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-v063-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-windows:
    name: Kiem tra Windows 10-11 nhieu vong
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v5

      - name: Cai Python 3.11 64-bit
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Vong 1 - kiem tra ma nguon va unit test
        shell: pwsh
        run: |
          python -m compileall -q app.py douyin_translator tests
          python -m pytest -q

      - name: Vong 2 - lap lai unit test de bat loi chap chon
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Vong 3 - self-test day du AI Voice va tach thoai
        shell: pwsh
        env:
          DOUYIN_TEST_DUBBING: "1"
          TORCH_HOME: ${{ runner.temp }}\torch-home-source-v063
        run: |
          Remove-Item Env:DOUYIN_E2E_URL -ErrorAction SilentlyContinue
          python app.py --full-self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test mã nguồn thất bại. Xem SELF_TEST_OK.txt trong báo cáo lỗi." }
          $report = Get-Content SELF_TEST_OK.txt -Raw
          @(
            "SELF TEST: DAT",
            "Phien ban: 0.6.3",
            "Giong Viet AI: DAT",
            "Tach thoai Trung: DAT",
            "Xoa phu de Trung: DAT",
            "Giong nhan vat co dinh: DAT",
            "Dich rut gon theo thoi luong: DAT"
          ) | ForEach-Object {
            if ($report -notmatch [regex]::Escape($_)) { throw "Báo cáo thiếu kết quả: $_" }
          }

      - name: Dong goi ung dung Windows
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name Douyin_AI_Translator `
            --collect-all numpy `
            --collect-all websockets `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            --collect-all edge_tts `
            --collect-all demucs `
            --collect-all torch `
            --collect-all torchaudio `
            --collect-all cv2 `
            app.py

      - name: Vong 4 - test truc tiep file EXE
        shell: pwsh
        env:
          DOUYIN_TEST_DUBBING: "1"
          TORCH_HOME: ${{ runner.temp }}\torch-home-exe-v063
        run: |
          Remove-Item SELF_TEST_OK.txt -ErrorAction SilentlyContinue
          Remove-Item Env:DOUYIN_E2E_URL -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath "dist/Douyin_AI_Translator/Douyin_AI_Translator.exe" `
            -ArgumentList "--full-self-test" `
            -PassThru `
            -Wait
          if ($process.ExitCode -ne 0) { throw "EXE self-test thất bại: mã $($process.ExitCode)" }
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "EXE không tạo báo cáo kiểm thử." }
          $report = Get-Content SELF_TEST_OK.txt -Raw
          if ($report -notmatch "SELF TEST: DAT") { throw "EXE chưa đạt self-test." }
          if ($report -notmatch "Phien ban: 0.6.3") { throw "EXE sai phiên bản." }

      - name: Nen ban Windows da test
        shell: pwsh
        run: |
          Copy-Item README.md dist/Douyin_AI_Translator/README.txt
          Copy-Item SELF_TEST_OK.txt dist/Douyin_AI_Translator/SELF_TEST_OK.txt
          Compress-Archive `
            -Path dist/Douyin_AI_Translator/* `
            -DestinationPath Douyin_AI_Translator_Windows_v0.6.3_TESTED.zip `
            -Force

      - name: Dang bao cao khi loi
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: Bao_cao_loi_v0.6.3
          path: SELF_TEST_OK.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Dang file Windows khi tat ca vong dat
        uses: actions/upload-artifact@v5
        with:
          name: Douyin_AI_Translator_Windows_v0.6.3_TESTED
          path: Douyin_AI_Translator_Windows_v0.6.3_TESTED.zip
          if-no-files-found: error
          retention-days: 30
