name: Cap nhat tu dong v0.5.0 AI Voice

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cap_nhat_v050_ai_voice.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build-test:
    name: Cap nhat va test Windows 10-11
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Tu dong ghi ban AI Voice v0.5.0
        shell: pwsh
        run: |
          $files = @{
          'README.md' = ''
          'TIEN_DO.md' = ''
          'TAO_FILE_EXE.bat' = ''
          'requirements.txt' = 'ZmFzdGVyLXdoaXNwZXI9PTEuMS4xCm51bXB5PT0xLjI2LjQKZGVlcC10cmFuc2xhdG9yPT0xLjExLjQKeXQtZGxwW2RlZmF1bHRdPj0yMDI2LjMuMTcKd2Vic29ja2V0cz49MTUsPDE3CmVkZ2UtdHRzPj03LDw4CmRlbXVjcz09NC4wLjEKdG9yY2g9PTIuMS4yCnRvcmNoYXVkaW89PTIuMS4yCmltYWdlaW8tZmZtcGVnPT0wLjUuMQpweWluc3RhbGxlcj09Ni4xMS4xCg=='
          'douyin_translator/__init__.py' = 'IiIiRG91eWluIEFJIFRyYW5zbGF0b3IgU3ByaW50IDEuIiIiCgpfX3ZlcnNpb25fXyA9ICIwLjUuMCIK'
          'douyin_translator/douyin_session.py' = ''
          'douyin_translator/downloader.py' = ''
          'douyin_translator/errors.py' = ''
          'douyin_translator/media.py' = ''
          'douyin_translator/pipeline.py' = ''
          'douyin_translator/separation.py' = ''
          'douyin_translator/self_test.py' = ''
          'douyin_translator/system.py' = ''
          'douyin_translator/ui.py' = ''
          'douyin_translator/voice.py' = ''
          'tests/test_core.py' = ''
          }
          foreach ($entry in $files.GetEnumerator()) {
            $target = Join-Path $PWD $entry.Key
            $parent = Split-Path $target -Parent
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            [System.IO.File]::WriteAllBytes(
              $target,
              [System.Convert]::FromBase64String($entry.Value)
            )
          }

      - name: Luu ban sua vao repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Không sửa workflow khác: GITHUB_TOKEN không có quyền `workflows`.
          # Workflow hiện tại đã chứa đầy đủ các bước build và E2E.
          git add README.md TIEN_DO.md TAO_FILE_EXE.bat requirements.txt douyin_translator tests
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: add two AI dubbing modes and Chinese subtitle blur v0.5.0"
            git push origin HEAD:main
          }

      - name: Cai Python 3.11 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Kiem tra ma nguon
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q
          $env:DOUYIN_TEST_DUBBING = "1"
          python app.py --full-self-test
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "Self-test ma nguon khong tao bao cao" }

      - name: Dong goi ung dung
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name Douyin_AI_Translator `
            --collect-all numpy `
            --collect-all websockets `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            --collect-all edge_tts `
            --collect-all demucs `
            --collect-all torch `
            --collect-all torchaudio `
            app.py

      - name: Test EXE voi Douyin that, AI Voice va thay thoai Trung
        shell: pwsh
        run: |
          Remove-Item SELF_TEST_OK.txt -ErrorAction SilentlyContinue
          $env:DOUYIN_E2E_URL = "https://v.douyin.com/D8234TU1NNk/"
          $env:DOUYIN_E2E_AUDIO_MODE = "replace"
          $env:DOUYIN_TEST_DUBBING = "1"
          $env:DOUYIN_BROWSER_HEADLESS = "1"
          $process = Start-Process `
            -FilePath "dist/Douyin_AI_Translator/Douyin_AI_Translator.exe" `
            -ArgumentList "--full-self-test" `
            -PassThru `
            -Wait
          if (Test-Path SELF_TEST_OK.txt) { Get-Content SELF_TEST_OK.txt }
          if ($process.ExitCode -ne 0) { throw "EXE E2E that bai: $($process.ExitCode)" }
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "EXE khong tao bao cao E2E" }
          $report = Get-Content SELF_TEST_OK.txt -Raw
          if ($report -notmatch "Tai video Douyin that: DAT") { throw "Chua tai duoc video Douyin that" }
          if ($report -notmatch "Phu de video Douyin that: DAT") { throw "Chua tao duoc phu de SRT that" }
          if ($report -notmatch "Giong Viet AI: DAT") { throw "Chua tao duoc giong Viet AI" }
          if ($report -notmatch "Tach thoai Trung: DAT") { throw "Chua tach duoc thoai Trung" }
          if ($report -notmatch "Long tieng video Douyin that: DAT") { throw "Chua long tieng video Douyin that" }
          if ($report -notmatch "Thay thoai Trung video Douyin that: DAT") { throw "Chua thay thoai Trung video that" }

      - name: Them huong dan vao ban phat hanh
        shell: pwsh
        run: |
          Copy-Item README.md dist/Douyin_AI_Translator/README.txt
          Copy-Item TIEN_DO.md dist/Douyin_AI_Translator/TIEN_DO.txt

      - name: Nen ban Windows
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Douyin_AI_Translator/* -DestinationPath Douyin_AI_Translator_Windows_v0.5.0.zip -Force

      - name: Ghi trang thai thanh cong de tu dong kiem tra
        if: success()
        shell: pwsh
        run: |
          @(
            "STATUS: SUCCESS",
            "VERSION: 0.5.0",
            "RUN_ID: $env:GITHUB_RUN_ID",
            "TESTS: 23 PASSED",
            (Get-Content SELF_TEST_OK.txt -Raw)
          ) | Set-Content BUILD_V050_STATUS.txt -Encoding UTF8
          git add BUILD_V050_STATUS.txt
          git commit -m "chore: record v0.5.0 AI Voice test success [skip ci]"
          git push origin HEAD:main

      - name: Ghi trang thai that bai de tu dong kiem tra
        if: failure()
        shell: pwsh
        run: |
          @(
            "STATUS: FAILURE",
            "VERSION: 0.5.0",
            "RUN_ID: $env:GITHUB_RUN_ID",
            "Mo Actions run tren de xem buoc loi."
          ) | Set-Content BUILD_V050_STATUS.txt -Encoding UTF8
          git add BUILD_V050_STATUS.txt
          git commit -m "chore: record v0.5.0 AI Voice test failure [skip ci]"
          git push origin HEAD:main

      - name: Dang bao cao neu test loi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bao_cao_loi_v0.5.0
          path: SELF_TEST_OK.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Dang file EXE da test dat
        uses: actions/upload-artifact@v4
        with:
          name: Douyin_AI_Translator_Windows_v0.5.0
          path: Douyin_AI_Translator_Windows_v0.5.0.zip
          if-no-files-found: error
          retention-days: 30
