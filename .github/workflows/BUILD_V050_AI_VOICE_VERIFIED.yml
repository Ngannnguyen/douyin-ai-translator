name: BUILD EXE AI VOICE VERIFIED v0.5.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/BUILD_V050_AI_VOICE_VERIFIED.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-windows:
    name: Build va test EXE Windows 10-11
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Lay ma nguon da sua
        uses: actions/checkout@v4

      - name: Cai Python 3.11 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test ma nguon va AI that
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q
          $env:DOUYIN_TEST_DUBBING = "1"
          Remove-Item Env:DOUYIN_E2E_URL -ErrorAction SilentlyContinue
          python app.py --full-self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test ma nguon that bai" }
          $report = Get-Content SELF_TEST_OK.txt -Raw
          if ($report -notmatch "Giong Viet AI: DAT") { throw "AI Voice chua dat" }
          if ($report -notmatch "Tach thoai Trung: DAT") { throw "HTDemucs chua dat" }
          if ($report -notmatch "Lam mo phu de Trung: DAT") { throw "Lam mo phu de chua dat" }

      - name: Dong goi ung dung
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name Douyin_AI_Translator `
            --collect-all numpy `
            --collect-all websockets `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            --collect-all edge_tts `
            --collect-all demucs `
            --collect-all torch `
            --collect-all torchaudio `
            app.py

      - name: Test truc tiep EXE voi AI Voice va HTDemucs
        shell: pwsh
        run: |
          Remove-Item SELF_TEST_OK.txt -ErrorAction SilentlyContinue
          $env:DOUYIN_TEST_DUBBING = "1"
          Remove-Item Env:DOUYIN_E2E_URL -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath "dist/Douyin_AI_Translator/Douyin_AI_Translator.exe" `
            -ArgumentList "--full-self-test" `
            -PassThru `
            -Wait
          if ($process.ExitCode -ne 0) { throw "EXE self-test that bai: $($process.ExitCode)" }
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "EXE khong tao bao cao" }
          $report = Get-Content SELF_TEST_OK.txt -Raw
          Get-Content SELF_TEST_OK.txt
          if ($report -notmatch "SELF TEST: DAT") { throw "EXE chua dat self-test" }
          if ($report -notmatch "Giong Viet AI: DAT") { throw "EXE chua tao duoc AI Voice" }
          if ($report -notmatch "Tach thoai Trung: DAT") { throw "EXE chua tach duoc thoai Trung" }
          if ($report -notmatch "Lam mo phu de Trung: DAT") { throw "EXE chua lam mo phu de Trung" }

      - name: Them huong dan va bao cao test
        shell: pwsh
        run: |
          Copy-Item README.md dist/Douyin_AI_Translator/README.txt
          Copy-Item TIEN_DO.md dist/Douyin_AI_Translator/TIEN_DO.txt
          Copy-Item SELF_TEST_OK.txt dist/Douyin_AI_Translator/SELF_TEST_OK.txt

      - name: Nen ban Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/Douyin_AI_Translator/* `
            -DestinationPath Douyin_AI_Translator_Windows_v0.5.0_AI_Voice_TESTED.zip `
            -Force

      - name: Dang file EXE chi khi moi test deu dat
        uses: actions/upload-artifact@v4
        with:
          name: Douyin_AI_Translator_Windows_v0.5.0_AI_Voice_TESTED
          path: Douyin_AI_Translator_Windows_v0.5.0_AI_Voice_TESTED.zip
          if-no-files-found: error
          retention-days: 30
