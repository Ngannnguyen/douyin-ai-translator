name: Tao ban Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows 10-11
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python 3.11 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Kiem tra ma nguon
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q
          python app.py --full-self-test
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "Self-test ma nguon khong tao bao cao" }

      - name: Dong goi ung dung
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name Douyin_AI_Translator `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            app.py

      - name: Chay thu file EXE tren Windows
        shell: pwsh
        run: |
          Remove-Item SELF_TEST_OK.txt -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath "dist/Douyin_AI_Translator/Douyin_AI_Translator.exe" `
            -ArgumentList "--full-self-test" `
            -PassThru `
            -Wait
          if ($process.ExitCode -ne 0) { throw "EXE self-test that bai: $($process.ExitCode)" }
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "EXE khong tao bao cao self-test" }
          Get-Content SELF_TEST_OK.txt

      - name: Them huong dan vao ban phat hanh
        shell: pwsh
        run: |
          Copy-Item README.md dist/Douyin_AI_Translator/README.txt
          Copy-Item TIEN_DO.md dist/Douyin_AI_Translator/TIEN_DO.txt

      - name: Nen ban Windows
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Douyin_AI_Translator/* -DestinationPath Douyin_AI_Translator_Windows_v0.3.0.zip -Force

      - name: Dang tai file Windows
        uses: actions/upload-artifact@v4
        with:
          name: Douyin_AI_Translator_Windows_v0.3.0
          path: Douyin_AI_Translator_Windows_v0.3.0.zip
          if-no-files-found: error
          retention-days: 30
