name: Cap nhat tu dong v0.4.0
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cap_nhat_v040.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build-test:
    name: Cap nhat va test Windows 10-11
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Tu dong ghi ban sua v0.4.0
        shell: pwsh
        run: |
          $files = @{
          '.github/workflows/build-windows.yml' = ''
          'README.md' = ''
          'TIEN_DO.md' = ''
          'requirements.txt' = 'ZmFzdGVyLXdoaXNwZXI9PTEuMS4xCm51bXB5PT0xLjI2LjQKZGVlcC10cmFuc2xhdG9yPT0xLjExLjQKeXQtZGxwW2RlZmF1bHRdPj0yMDI2LjMuMTcKd2Vic29ja2V0cz49MTUsPDE3CmltYWdlaW8tZmZtcGVnPT0wLjUuMQpweWluc3RhbGxlcj09Ni4xMS4xCg=='
          'douyin_translator/__init__.py' = 'IiIiRG91eWluIEFJIFRyYW5zbGF0b3IgU3ByaW50IDEuIiIiCgpfX3ZlcnNpb25fXyA9ICIwLjQuMCIK'
          'douyin_translator/douyin_session.py' = ''
          'douyin_translator/downloader.py' = ''
          'douyin_translator/errors.py' = ''
          'douyin_translator/self_test.py' = ''
          'douyin_translator/ui.py' = ''
          'tests/test_core.py' = ''
          }
          foreach ($entry in $files.GetEnumerator()) {
            $target = Join-Path $PWD $entry.Key
            $parent = Split-Path $target -Parent
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            [System.IO.File]::WriteAllBytes(
              $target,
              [System.Convert]::FromBase64String($entry.Value)
            )
          }

      - name: Luu ban sua vao repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-windows.yml README.md TIEN_DO.md requirements.txt douyin_translator tests
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: isolated Douyin session and real Windows E2E v0.4.0"
            git push origin HEAD:main
          }

      - name: Cai Python 3.11 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Cai thu vien
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Kiem tra ma nguon
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q
          python app.py --full-self-test
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "Self-test ma nguon khong tao bao cao" }

      - name: Dong goi ung dung
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name Douyin_AI_Translator `
            --collect-all numpy `
            --collect-all websockets `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            app.py

      - name: Test EXE voi link Douyin that va phu de SRT
        shell: pwsh
        run: |
          Remove-Item SELF_TEST_OK.txt -ErrorAction SilentlyContinue
          $env:DOUYIN_E2E_URL = "https://v.douyin.com/D8234TU1NNk/"
          $env:DOUYIN_BROWSER_HEADLESS = "1"
          $process = Start-Process `
            -FilePath "dist/Douyin_AI_Translator/Douyin_AI_Translator.exe" `
            -ArgumentList "--full-self-test" `
            -PassThru `
            -Wait
          if (Test-Path SELF_TEST_OK.txt) { Get-Content SELF_TEST_OK.txt }
          if ($process.ExitCode -ne 0) { throw "EXE E2E that bai: $($process.ExitCode)" }
          if (-not (Test-Path SELF_TEST_OK.txt)) { throw "EXE khong tao bao cao E2E" }
          $report = Get-Content SELF_TEST_OK.txt -Raw
          if ($report -notmatch "Tai video Douyin that: DAT") { throw "Chua tai duoc video Douyin that" }
          if ($report -notmatch "Phu de video Douyin that: DAT") { throw "Chua tao duoc phu de SRT that" }

      - name: Them huong dan vao ban phat hanh
        shell: pwsh
        run: |
          Copy-Item README.md dist/Douyin_AI_Translator/README.txt
          Copy-Item TIEN_DO.md dist/Douyin_AI_Translator/TIEN_DO.txt

      - name: Nen ban Windows
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Douyin_AI_Translator/* -DestinationPath Douyin_AI_Translator_Windows_v0.4.0.zip -Force

      - name: Dang bao cao neu test loi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bao_cao_loi_v0.4.0
          path: SELF_TEST_OK.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Dang file EXE da test dat
        uses: actions/upload-artifact@v4
        with:
          name: Douyin_AI_Translator_Windows_v0.4.0
          path: Douyin_AI_Translator_Windows_v0.4.0.zip
          if-no-files-found: error
          retention-days: 30
